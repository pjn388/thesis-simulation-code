[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thesis-pipe-sim"
version = "0.1.0"
description = "Reproducible dent and gouge pipe simulations with CalculiX"
requires-python = ">=3.11,<3.14"
dependencies = ["gmsh>=4.13,<5", "numpy>=2,<3", "scipy>=1.14,<2", "pandas>=2.2,<3", "matplotlib>=3.9,<4", "meshio>=5.3,<6"]

[dependency-groups]
dev = ["pytest>=8,<10"]
solver = [
    "mkl==2025.3.0",
    "mkl-include==2025.3.0",
]

[project.scripts]
pipe-sim = "pipe_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipe_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.uv]
default-groups = ["dev", "solver"]
